<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практическая работа №7</title>
  <link rel="stylesheet" href="styles.css">
  <script src="student-template.js" defer></script>
  <script src="browser-practice-template.js" defer></script>
</head>
<body>
  <main class="container">
    <h1 id="main-title">Практическая работа №7</h1>

    <section class="panel">
      <h2>1–3. Изменение существующих элементов</h2>
      <p id="info-block">Информационный блок.</p>
      <a id="main-link" href="#">Исходная ссылка</a>
      <div class="actions">
        <button id="demo-title-btn">Изменить заголовок</button>
        <button id="demo-toggle-btn">Показать / скрыть блок</button>
        <button id="demo-link-btn">Изменить ссылку</button>
      </div>
    </section>

    <section class="panel">
      <h2>4. Динамический список</h2>
      <ul id="task-list"></ul>
      <button id="demo-add-btn">Добавить пункт</button>
    </section>

    <section class="panel">
      <h2>5–6. Карточки товаров</h2>
      <div id="products" class="products"></div>
      <button id="demo-products-btn">Показать товары</button>
    </section>
  </main>

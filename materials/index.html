<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM — примеры</title>
  <link rel="stylesheet" href="styles.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main class="container">
    <h1 id="main-title">DOM в JavaScript</h1>

    <section class="demo">
      <h2>Текст и классы</h2>
      <p id="info-block">Этот блок можно скрывать и показывать.</p>
      <button id="change-title-button">Изменить заголовок</button>
      <button id="toggle-info-button">Показать / скрыть</button>
    </section>

    <section class="demo">
      <h2>Атрибуты</h2>
      <a id="main-link" href="#">Исходная ссылка</a>
      <button id="change-link-button">Изменить ссылку</button>
    </section>

    <section class="demo">
      <h2>Создание элементов</h2>
      <ul id="demo-list">
        <li>Первый пункт</li>
      </ul>
      <button id="add-item-button">Добавить пункт</button>
    </section>

    <section class="demo">
      <h2>Массив объектов</h2>
      <div id="products" class="products"></div>
    </section>
  </main>
</body>
</html>
